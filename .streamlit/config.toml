# Configuración de tema de Streamlit Cloud

[theme]
primaryColor = "#6366F1"
backgroundColor = "#0a0e1a"
secondaryBackgroundColor = "#0f172a"
textColor = "#f8fafc"
font = "sans serif"

[server]
maxUploadSize = 2048
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[runner]
magicEnabled = false
fastReruns = true

[client]
toolbarMode = "minimal"
showErrorDetails = false
